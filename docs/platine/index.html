<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Take-Marker Platine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
</head><body>
<style>
/* Konzept: gleiches Ingenieurblatt wie die Aufbau-Seite. Links die Platine als Zeichnung, rechts der Weg dahin. "Echt" zeigt das fertige grüne Teil. */
:root{
  --paper:#E2EBDC; --sheet:#EDF2E7; --grid:#CBDAC4; --grid2:#B2C8AB;
  --ink:#13302A; --ink2:#46625A; --line:#8FA79C; --fill:#F7FAF3;
  --mark:#FFE12E; --markink:#13302A;
  --cutop:#C0321F; --cubot:#1C6AB0; --tht:#A8790E; --via:#46625A;
  --mask:#0E5733; --maskcu:#23794A; --maskvia:#2C8553; --hasl:#D3D8DA; --silk:#F2F5EF; --hole:#0A120E; --edge:#C2B07C;
  --sans:'B612','Avenir Next','Segoe UI',system-ui,sans-serif;
  --mono:'B612 Mono','SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1614; --sheet:#141E1B; --grid:#1A2723; --grid2:#25352F;
  --ink:#DCEBE2; --ink2:#9FB6AB; --line:#4C655B; --fill:#1D2A26;
  --mark:#FFE12E; --markink:#13302A;
  --cutop:#FF7A66; --cubot:#6DB3F2; --tht:#E5B94E; --via:#9FB6AB;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1614; --sheet:#141E1B; --grid:#1A2723; --grid2:#25352F;
  --ink:#DCEBE2; --ink2:#9FB6AB; --line:#4C655B; --fill:#1D2A26;
  --mark:#FFE12E; --markink:#13302A;
  --cutop:#FF7A66; --cubot:#6DB3F2; --tht:#E5B94E; --via:#9FB6AB;
  color-scheme:dark;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
button{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1.5px solid var(--ink);background:var(--sheet)}
header h1{margin:0;font-size:18px;letter-spacing:.01em;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--mono);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:700}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}}

.stage{min-width:0;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px}
@media (max-width:920px){.stage{padding-right:max(16px,env(safe-area-inset-right,0px))}}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1.5px solid var(--ink);background:var(--sheet)}
.seg button{padding:5px 11px;font-size:13px;border-left:1.5px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.note{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.scroll{overflow-x:auto;border:1.5px solid var(--ink);background:var(--sheet)}
#pcb{display:block;width:100%;min-width:640px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px}

.gal-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px;color:var(--ink2)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal figure{margin:0;border:1.5px solid var(--ink);background:var(--sheet);min-width:0}
.gal figure.big{grid-column:1/-1}
.gal img{display:block;width:100%;height:auto}
.gal figcaption{font-family:var(--mono);font-size:12px;color:var(--ink2);padding:6px 8px;border-top:1px solid var(--line)}
@media (max-width:600px){.gal{grid-template-columns:1fr}}
aside{border-left:1.5px solid var(--ink);background:var(--sheet);min-width:0;
  padding-block:6px 24px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:920px){.gal-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px;color:var(--ink2)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal figure{margin:0;border:1.5px solid var(--ink);background:var(--sheet);min-width:0}
.gal figure.big{grid-column:1/-1}
.gal img{display:block;width:100%;height:auto}
.gal figcaption{font-family:var(--mono);font-size:12px;color:var(--ink2);padding:6px 8px;border-top:1px solid var(--line)}
@media (max-width:600px){.gal{grid-template-columns:1fr}}
aside{border-left:0;border-top:1.5px solid var(--ink);padding-left:max(16px,env(safe-area-inset-left,0px))}}
aside h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;color:var(--ink2)}

ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
ol.steps li{border-bottom:1px solid var(--line)}
.step{display:grid;grid-template-columns:24px minmax(0,1fr) 22px;gap:8px;align-items:baseline;width:100%;text-align:left;padding:8px 0}
.step .n{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.step .t{font-weight:700}
.step .plus{font-family:var(--mono);color:var(--ink2);text-align:right}
li.on .step .t{background:var(--mark);color:var(--markink);box-shadow:0 0 0 2px var(--mark)}
.more{margin:0 0 10px 32px;font-size:13px;color:var(--ink2);display:grid;gap:4px}
.more p{margin:0}
.nav{display:flex;gap:8px;margin-top:10px}
.nav button{border:1.5px solid var(--ink);padding:5px 12px;font-size:13px;background:var(--fill)}
.nav button:disabled{opacity:.35;cursor:default}

.chips{display:grid;gap:8px}
.grp{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px;align-items:start}
.grp>span{font-family:var(--mono);font-size:11px;color:var(--ink2);padding-top:4px}
.grp div{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.2px solid var(--ink);padding:2px 8px;font-size:12px;font-family:var(--mono);background:var(--fill)}
.chip[aria-pressed="true"]{background:var(--mark);color:var(--markink);border-color:var(--markink)}
.info{margin-top:10px;border:1.5px solid var(--ink);background:var(--fill);padding:10px 12px;display:grid;gap:4px;font-size:13px}
.info b{font-size:14px}
.info .k{font-family:var(--mono);font-size:12px;color:var(--ink2)}

table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{text-align:left;padding:5px 6px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--ink2);font-weight:400;font-family:var(--mono)}
td:first-child{font-family:var(--mono);white-space:nowrap}
.todo{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}
.todo li::marker{color:var(--ink2)}

/* SVG */
.bd{fill:var(--sheet);stroke:var(--ink);stroke-width:.18}
.bdE{fill:var(--mask);stroke:var(--edge);stroke-width:.25}
.dim{stroke:var(--ink2);stroke-width:.1;fill:none}
.dimt{fill:var(--ink2);font-family:var(--mono);font-size:1.15px}
.side{fill:var(--ink2);font-family:var(--mono);font-size:1px;letter-spacing:.05px}
.trT{stroke:var(--cutop);fill:none;stroke-linecap:round;stroke-linejoin:round}
.trB{stroke:var(--cubot);fill:none;stroke-linecap:round;stroke-linejoin:round}
.trE{stroke:var(--maskcu);fill:none;stroke-linecap:round;stroke-linejoin:round}
.pdT{fill:var(--cutop)} .pdB{fill:var(--cubot)} .pdH{fill:var(--tht)} .pdE{fill:var(--hasl)}
.plB{fill:var(--cubot);opacity:.2} .plE{fill:var(--maskcu)}
.via{fill:var(--via)} .viaE{fill:var(--maskvia)}
.hole{fill:var(--sheet)} .holeE{fill:var(--hole)}
.hi{stroke:var(--mark);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hiF{fill:var(--mark)}
.pin{fill:var(--ink2);font-family:var(--mono);font-size:.62px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.ref{fill:var(--ink);font-family:var(--mono);font-size:1px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.outl{fill:none;stroke:var(--ink2);stroke-width:.1;stroke-dasharray:.5 .35}
.outlB{fill:none;stroke:var(--cubot);stroke-width:.1;stroke-dasharray:.35 .35}
.silk{fill:none;stroke:var(--silk);stroke-width:.15}
.silkt{fill:var(--silk);font-family:var(--mono);font-size:.95px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.dimmed{opacity:.16}
[data-net]{cursor:pointer}
.part{pointer-events:none}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}
</style>

<header>
  <h1>Take-Marker Platine</h1>
  <div class="facts" id="facts"></div>
</header>

<div class="wrap">
  <section class="stage">
    <div class="tools">
      <div class="seg" role="group" aria-label="Darstellung" id="segLook">
        <button id="lkL" data-look="lagen" aria-pressed="true">Lagen</button>
        <button id="lkE" data-look="echt" aria-pressed="false">Echt</button>
      </div>
      <div class="seg" role="group" aria-label="Seite" id="segSide">
        <button id="sdO" data-side="oben" aria-pressed="false">Oben</button>
        <button id="sdU" data-side="unten" aria-pressed="false">Unten</button>
        <button id="sdD" data-side="durch" aria-pressed="true">Beide</button>
      </div>
      <div class="seg" role="group" aria-label="Bauteile">
        <button id="btParts" aria-pressed="false">Bauteile</button>
      </div>
      <span class="note" id="sideNote"></span>
    </div>
    <div class="scroll"><svg id="pcb" viewBox="-5.5 -6.5 72 31.5" role="img" aria-label="Platine 61 mal 22 Millimeter"></svg></div>
    <div class="legend" id="legend"></div>
    <h2 class="gal-h">In KiCad gerendert</h2>
    <div class="gal">
      <figure class="big"><img src="bilder/render-iso.png" alt="3D-Ansicht der Platine aus KiCad, schräg von oben" width="1600" height="1000"><figcaption>3D-Ansicht, ohne Bauteile</figcaption></figure>
      <figure><img src="bilder/render-top.png" alt="Oberseite der Platine aus KiCad" width="2000" height="760"><figcaption>Oberseite</figcaption></figure>
      <figure><img src="bilder/render-bottom.png" alt="Unterseite der Platine aus KiCad, von unten gesehen" width="2000" height="760"><figcaption>Unterseite, von unten gesehen (gespiegelt)</figcaption></figure>
    </div>
  </section>

  <aside>
    <h2>So entsteht sie</h2>
    <ol class="steps" id="steps"></ol>
    <div class="nav"><button id="prev">Zurück</button><button id="next">Weiter</button></div>

    <h2>Leitungen</h2>
    <div class="chips" id="chips"></div>
    <div class="info" id="info" hidden></div>

    <h2>Stückliste</h2>
    <table>
      <thead><tr><th>Ref</th><th>Teil</th><th>Seite</th></tr></thead>
      <tbody id="bom"></tbody>
    </table>

    <h2>Vor der Bestellung klären</h2>
    <ol class="todo" id="todo"></ol>

    <h2>Neu seit dem Entwurf vom 02.11.</h2>
    <ul class="todo" id="neu"></ul>
  </aside>
</div>

    s+=rr(x-1.3,7.4,8.3,7.2,.9,'','fill="#B9BEC1" stroke="#7E8487" stroke-width=".12"');
    s+=rr(x+1.0,9.2,4.6,3.6,1.6,'','fill="#2A2E31"');
    s+=rr(7.6,3.9,12.2,14.2,.4,'','fill="#C9CDD0" stroke="#8E9497" stroke-width=".12"');
    s+=`<text x="13.7" y="10.2" class="ref" style="fill:#3A4044;font-size:1.2px">XIAO</text><text x="13.7" y="11.8" class="ref" style="fill:#3A4044;font-size:.85px">ESP32-S3</text>`;
    D.pads.filter(p=>p.ref==='U1'&&p.layer==='T').forEach(p=>s+=`<circle cx="${f(p.x)}" cy="${p.y<11?2.1:19.9}" r=".55" fill="#D9C27A"/>`);
  }else if(c.kind==='btn'){
    const cx=x+w/2,cy=y+h/2,sym=c.ref==='SW1'?'○':'△';
    s+=rr(x,y,w,h,.3,'','fill="#2B2F31"');
    s+=`<circle cx="${cx}" cy="${cy}" r="1.75" fill="#55595C"/><text x="${cx}" y="${cy+.05}" class="ref" style="fill:#F2F2F2;font-size:1.6px">${sym}</text>`;
  }else if(c.kind==='mic'){
    const cx=x+w/2,cy=y+h/2;
    s+=`<circle cx="${cx}" cy="${cy}" r="7.6" fill="#151515" opacity=".93"/><circle cx="${cx}" cy="${cy}" r="6.9" fill="none" stroke="#C9A24A" stroke-width=".45" opacity=".9"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r=".45" fill="#C9A24A"/><text x="${cx}" y="${cy+1.6}" class="ref" style="fill:#EDE6D2;font-size:.9px">Mikrofon</text>`;
  }else if(c.kind==='led'){
    s+=rr(34.6,8.4,1.8,1.2,.2,'','fill="#F3EFE2" stroke="#BDB59C" stroke-width=".08"')+`<circle cx="35.5" cy="9" r=".38" fill="#F2D33A"/>`;
  }else if(c.kind==='r'){
    if(c.vert)s+=rr(x+.15,y+.55,.7,1.4,.08,'','fill="#1E1E1E"');
    else if(c.ref==='R1')s+=rr(34.6,12.4,1.8,1.2,.08,'','fill="#1E1E1E"');
    else s+=rr(x+.55,y+.15,1.4,.7,.08,'','fill="#1E1E1E"');
  }else if(c.kind==='c'){
    s+=rr(37.3,1.95,2.4,1.3,.12,'','fill="#B89C6C"');
  }else if(c.kind==='slide'){
    s+=rr(46.0,-1.1,2.0,1.7,.2,'','fill="#202325"');
    s+=rr(x,y,w,h,.2,'','fill="#BFC4C7" stroke="#80868A" stroke-width=".12"');
  }else if(c.kind==='sd'){
    s+=rr(x,y,w,h,.4,'','fill="#C3C8CB" stroke="#80868A" stroke-width=".14" opacity=".92"');
    s+=rr(x+1.5,H-1.2,w-3,.8,.2,'','fill="#7A8084"');
    s+=`<text x="${x+w/2}" y="${y+h/2}" class="ref" style="fill:#4A5054">microSD</text>`;
  }
  return `<g class="part">${s}</g>`;
}

function render(){
  const {look,side,parts,reveal,net}=S, E=look==='echt';
  const showT=side!=='unten', showB=side!=='oben';
  const dimC=n=>net&&n!==net?' dimmed':'';
  let s='';
  s+=`<defs><mask id="pm" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><image href="${D.plane.png}" x="${-D.plane.res/2}" y="${-D.plane.res/2}" width="${W+D.plane.res}" height="${H+D.plane.res}" preserveAspectRatio="none"/></mask>
    <clipPath id="bc"><rect x="0" y="0" width="${W}" height="${H}" rx="1.5"/></clipPath></defs>`;
  s+=rr(0,0,W,H,1.5,E?'bdE':'bd');
  if(!E){
    s+=`<path class="dim" d="M0 -5.6V-3.6M${W} -5.6V-3.6M0 -4.6H${W}"/><text class="dimt" x="${W/2}" y="-5.1" text-anchor="middle">61 mm</text>`;
    s+=`<path class="dim" d="M-4.2 0H-2.2M-4.2 ${H}H-2.2M-3.2 0V${H}"/><text class="dimt" x="-3.7" y="${H/2}" text-anchor="middle" transform="rotate(-90 -3.7 ${H/2})">22 mm</text>`;
    s+=`<text class="side" x="${W+1.3}" y="${H/2}" text-anchor="middle" transform="rotate(90 ${W+1.3} ${H/2})">VORNE · MIKROFON</text>`;
    s+=`<text class="side" x="${W/2}" y="${H+1.8}" text-anchor="middle">SEITE · KARTENSCHLITZ</text>`;
    s+=`<text class="side" x="${W/2-14}" y="-1.2" text-anchor="middle">SEITE · SCHALTER</text>`;
  }
  s+='<g clip-path="url(#bc)">';
  const hiOn=net&&reveal>=3;
  // Massefläche
  if(reveal>=3&&showB&&(!E||side==='unten'))
    s+=`<rect x="0" y="0" width="${W}" height="${H}" class="${E?'plE':'plB'}${dimC('gnd')}" mask="url(#pm)" data-net="gnd"/>`;
  // Markierung unter der gewählten Leitung
  if(hiOn){
    D.traces.filter(t=>t.net===net&&((t.layer==='T'&&showT)||(t.layer==='B'&&showB))).forEach(t=>s+=`<polyline points="${pts(t.pts)}" class="hi" stroke-width=".9"/>`);
    D.pads.filter(p=>p.net===net).forEach(p=>s+=padShape(p,'hiF',.3));
    D.vias.filter(v=>v.net===net).forEach(v=>s+=`<circle cx="${f(v.x)}" cy="${f(v.y)}" r=".7" class="hiF"/>`);
  }
  const trace=(t)=>`<polyline points="${pts(t.pts)}" class="${E?'trE':(t.layer==='T'?'trT':'trB')}${dimC(t.net)}" stroke-width=".25" data-net="${t.net}"/>`;
  const hit=(t)=>`<polyline points="${pts(t.pts)}" stroke="transparent" stroke-width="1" fill="none" data-net="${t.net}"/>`;
  if(reveal>=3&&showB&&!(E&&side==='oben')){D.traces.filter(t=>t.layer==='B').forEach(t=>s+=trace(t)+hit(t))}
  if(reveal>=2&&showB&&!(E&&side==='oben'))D.pads.filter(p=>p.layer==='B').forEach(p=>s+=padShape(p,(E?'pdE':'pdB')+dimC(p.net),0,p.net?`data-net="${p.net}"`:''));
  if(reveal>=3&&showT&&!(E&&side==='unten')){D.traces.filter(t=>t.layer==='T').forEach(t=>s+=trace(t)+hit(t))}
  if(reveal>=2&&showT&&!(E&&side==='unten'))D.pads.filter(p=>p.layer==='T').forEach(p=>s+=padShape(p,(E?'pdE':'pdT')+dimC(p.net),0,p.net?`data-net="${p.net}"`:''));
  if(reveal>=2)D.pads.filter(p=>p.layer==='TH').forEach(p=>{
    s+=padShape(p,(E?'pdE':'pdH')+dimC(p.net),0,`data-net="${p.net}"`);
    s+=`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(p.drill/2)}" class="${E?'holeE':'hole'}"/>`;
  });
  if(reveal>=3)D.vias.forEach(v=>{
    if(S.hiVias)s+=`<circle cx="${f(v.x)}" cy="${f(v.y)}" r=".95" class="hiF pulse"/>`;
    s+=`<circle cx="${f(v.x)}" cy="${f(v.y)}" r=".3" class="${E?'viaE':'via'}${dimC(v.net)}" data-net="${v.net}"/><circle cx="${f(v.x)}" cy="${f(v.y)}" r=".15" class="${E?'holeE':'hole'}"/>`;
  });
  // Bestückungsdruck
  if(E&&!parts){
    const L=side==='unten'?'B':'T';
    D.comps.filter(c=>c.layer===L).forEach(c=>{
      if(c.kind==='mic')s+=`<circle cx="${c.x+7.6}" cy="${c.y+7.6}" r="7.75" class="silk"/>`;
      else if(c.kind==='slide')s+=rr(c.x,c.y,c.w,c.h,.2,'silk');
      else if(c.kind!=='xiao')s+=rr(c.x-.15,c.y-.15,c.w+.3,c.h+.3,.15,'silk');
      const lx=c.kind==='mic'?c.x+7.6:c.x+c.w/2, ly=c.kind==='mic'?c.y+7.6:c.kind==='btn'||c.kind==='slide'?c.y+c.h/2:c.kind==='xiao'?c.y+c.h/2-2.2:c.y-.75;
      if(c.kind==='xiao')s+=rr(.25,2.35,20.5,17.3,.6,'silk','stroke-dasharray=".6 .4"');
      if(c.kind==='btn')s+=`<text class="silkt" x="${lx}" y="${ly}" style="font-size:2px">${c.ref==='SW1'?'○':'△'}</text><text class="silkt" x="${lx}" y="${c.y-.75}">${c.ref}</text>`;
      else s+=`<text class="silkt" x="${lx}" y="${ly}">${c.ref}</text>`;
    });
    if(side==='oben'){
      s+=`<text class="silkt" x="56" y="4.3">+</text><text class="silkt" x="59" y="4.3">−</text><text class="silkt" x="57.5" y="0.75" style="font-size:.7px">AKKU</text>`;
      s+=`<text class="silkt" x="8.235" y="13.8" style="font-size:.8px">−</text><text class="silkt" x="10.14" y="13.8" style="font-size:.8px">+</text>`;
      s+=`<text class="silkt" x="44" y="20.4" style="font-size:.9px;letter-spacing:.1px">TAKE-MARKER GEN 3 · V4</text>`;
    }else s+=`<text class="silkt" x="4.4" y="13.7" style="font-size:.8px">TP1 D2</text>`;
  }
  s+='</g>';
  // Bauteile
  if(parts){
    if(showB&&!(E&&side==='oben'))D.comps.filter(c=>c.layer==='B').forEach(c=>{s+= (E||side==='unten')?partSVG(c):rr(c.x,c.y,c.w,c.h,.3,'outlB')});
    if(showT&&!(E&&side==='unten'))D.comps.filter(c=>c.layer==='T').forEach(c=>{s+=partSVG(c)});
  }else if(!E&&reveal>=2){
    D.comps.forEach(c=>{
      if((c.layer==='T'&&!showT)||(c.layer==='B'&&!showB))return;
      if(c.kind==='mic')s+=`<circle cx="${c.x+7.6}" cy="${c.y+7.6}" r="7.6" class="${c.layer==='B'?'outlB':'outl'}"/>`;
      else s+=rr(c.x,c.y,c.w,c.h,.3,c.layer==='B'?'outlB':'outl');
      const ly=c.kind==='mic'?c.y+12.9:c.kind==='xiao'?c.y+c.h/2-1.1:c.kind==='sd'?c.y+c.h-2:c.y-.7;
      s+=`<text class="ref" x="${c.x+c.w/2}" y="${ly}" style="font-size:.85px">${c.ref}</text>`;
    });
  }
  // Pinnamen
  if(!E&&reveal>=2&&!parts){
    D.pads.forEach(p=>{
      if(!p.pin||p.pin==='M'||p.pin==='Schirm')return;
      if((p.layer==='T'&&!showT)||(p.layer==='B'&&!showB))return;
      let lx=p.x,ly=p.y;
      if(p.ref==='U1'&&p.layer==='T')ly=p.y<11?p.y+1.9:p.y-1.9;
      else if(p.ref==='J1')ly=p.y-1.35;
      else if(p.ref==='U2')ly=p.y+(p.y<11?-1.3:1.3);
      else if(p.ref==='U1')ly=p.y+1.5;
      else return;
      s+=`<text class="pin" x="${f(lx)}" y="${f(ly)}">${p.pin}</text>`;
    });
  }
  $('pcb').innerHTML=s;
  syncUI();
}

/* ---------- Bedienung ---------- */
function syncUI(){
  document.querySelectorAll('#segLook button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.look===S.look));
  document.querySelectorAll('#segSide button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.side===S.side));
  $('btParts').setAttribute('aria-pressed',S.parts);
  $('sideNote').textContent=S.side==='unten'?'Unterseite, von oben durchgesehen':S.side==='durch'?'beide Seiten übereinander':'';
  $('legend').innerHTML=S.look==='echt'
    ? '<span><i style="background:var(--mask)"></i>Lötstopplack</span><span><i style="background:var(--maskcu)"></i>Kupfer unter dem Lack</span><span><i style="background:var(--hasl);outline:1px solid var(--line)"></i>Lötfläche</span><span><i style="background:var(--silk);outline:1px solid var(--line)"></i>Bestückungsdruck</span>'
    : '<span><i style="background:var(--cutop)"></i>Kupfer oben</span><span><i style="background:var(--cubot)"></i>Kupfer unten</span><span><i style="background:var(--tht)"></i>durchgesteckt</span><span><i style="background:var(--via);height:8px;width:8px;border-radius:50%"></i>Via</span><span><i style="background:var(--mark)"></i>gewählt</span>';
  document.querySelectorAll('ol.steps li').forEach((li,i)=>li.classList.toggle('on',i===S.step));
  $('prev').disabled=S.step<=0; $('next').disabled=S.step>=STEPS.length-1;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.n===S.net));
  const inf=$('info');
  if(!S.net){inf.hidden=true;return}
  const n=NET[S.net]; let lt=0,lb=0;
  D.traces.filter(t=>t.net===S.net).forEach(t=>{for(let i=1;i<t.pts.length;i++){const l=Math.hypot(t.pts[i][0]-t.pts[i-1][0],t.pts[i][1]-t.pts[i-1][1]);t.layer==='T'?lt+=l:lb+=l}});
  const nv=D.vias.filter(v=>v.net===S.net).length;
  const conn=[...new Set(D.pads.filter(p=>p.net===S.net).map(p=>p.ref+(p.pin&&p.pin!=='Schirm'&&p.pin!=='+'&&p.pin!=='-'&&p.pin!=='1'&&p.pin!=='2'?' '+p.pin:'')))].join(', ');
  inf.hidden=false;
  inf.innerHTML=`<b>${n[0]}${n[1]?' · '+n[1]:''}</b><span>${n[2]}</span><span class="k">${S.net==='gnd'?'oben '+Math.round(lt)+' mm Stiche · '+nv+' Vias in die Fläche':'oben '+Math.round(lt)+' mm · unten '+Math.round(lb)+' mm · '+nv+' Vias'}</span><span class="k">${conn}</span>`;
}
function setStep(i){
  S.step=i; Object.assign(S,{hiVias:false},STEPS[i].s); if(STEPS[i].s.reveal<3)S.net=null;
  document.querySelectorAll('ol.steps li').forEach((li,j)=>{li.querySelector('.more').hidden=j!==i;li.querySelector('.plus').textContent=j===i?'−':'+'});
  render();
}
function free(){S.step=-1;S.hiVias=false;S.reveal=3;document.querySelectorAll('ol.steps .more').forEach(m=>m.hidden=true);document.querySelectorAll('ol.steps .plus').forEach(p=>p.textContent='+')}

$('steps').innerHTML=STEPS.map((st,i)=>`<li><button class="step" id="st${i}"><span class="n">${i+1}</span><span class="t">${st.t}</span><span class="plus">+</span></button><div class="more" hidden>${st.d.map(p=>`<p>${p}</p>`).join('')}</div></li>`).join('');
STEPS.forEach((_,i)=>$('st'+i).onclick=()=>{ if(S.step===i){free();document.querySelectorAll('ol.steps .more').forEach(m=>m.hidden=true);document.querySelectorAll('ol.steps .plus').forEach(p=>p.textContent='+');render()} else setStep(i)});
$('prev').onclick=()=>setStep(Math.max(0,S.step-1));
$('next').onclick=()=>setStep(Math.min(STEPS.length-1,S.step+1));
document.querySelectorAll('#segLook button').forEach(b=>b.onclick=()=>{S.look=b.dataset.look;if(S.look==='echt'&&S.side==='durch')S.side='oben';free();render()});
document.querySelectorAll('#segSide button').forEach(b=>b.onclick=()=>{S.side=b.dataset.side;if(S.side==='durch')S.look='lagen';free();render()});
$('btParts').onclick=()=>{S.parts=!S.parts;free();render()};

$('chips').innerHTML=GROUPS.map(g=>`<div class="grp"><span>${g}</span><div>${Object.entries(NET).filter(([k,v])=>v[3]===g&&k!=='led2').map(([k,v])=>`<button class="chip" data-n="${k}" id="ch-${k}">${v[0]}${v[1]?' '+v[1]:''}</button>`).join('')}</div></div>`).join('');
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>pick(c.dataset.n));
function pick(n){
  S.net=S.net===n?null:n;
  if(S.net&&S.reveal<3){S.reveal=3;S.step=-1}
  render();
}
$('pcb').addEventListener('click',e=>{const el=e.target.closest('[data-net]');if(el)pick(el.dataset.net);else if(S.net){S.net=null;render()}});

$('bom').innerHTML=BOM.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
$('todo').innerHTML=TODO.map(t=>`<li>${t}</li>`).join('');
$('neu').innerHTML=NEU.map(t=>`<li>${t}</li>`).join('');

setStep(5);
</script>
