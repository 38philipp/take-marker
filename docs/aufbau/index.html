<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Take-Marker Aufbau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
</head><body>
<style>
/* Konzept: Blatt vom grünen Ingenieurblock, Stückliste rechts, der Leuchtstift markiert die Auswahl. Dunkel = CAD-Bildschirm. */
:root{
  --paper:#E2EBDC; --sheet:#EDF2E7; --grid:#CBDAC4; --grid2:#B2C8AB;
  --ink:#13302A; --ink2:#46625A; --line:#8FA79C;
  --fill:#F7FAF3; --fill2:#CFDDC9; --fill3:#39574D;
  --mark:#FFE12E; --markink:#13302A;
  --power:#CF2A1C; --gnd:#13302A; --i2s:#7A1FA8; --spi:#0A58CF; --io:#AD5F06;
  --cutop:#C0321F; --cubot:#1C6AB0;
  --sbg:#FFFFFF; --sfr:#C8372E; --sfl:#ECB9B4; --ssy:#C8372E; --swi:#2C9C86; --stx:#5F6B66;
  --sans:'B612','Avenir Next','Segoe UI',system-ui,sans-serif;
  --mono:'B612 Mono','SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1614; --sheet:#141E1B; --grid:#1A2723; --grid2:#25352F;
  --ink:#DCEBE2; --ink2:#9FB6AB; --line:#4C655B;
  --fill:#1D2A26; --fill2:#2B3D36; --fill3:#0B1311;
  --mark:#FFE12E; --markink:#13302A;
  --power:#FF6F5E; --gnd:#DCEBE2; --i2s:#CA93F2; --spi:#74B4FF; --io:#F4B24F;
  --cutop:#FF7A66; --cubot:#6DB3F2;
  --sbg:#141E1B; --sfr:#FF6F5E; --sfl:#5A3A35; --ssy:#FF6F5E; --swi:#4FD1B0; --stx:#9FB6AB;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1614; --sheet:#141E1B; --grid:#1A2723; --grid2:#25352F;
  --ink:#DCEBE2; --ink2:#9FB6AB; --line:#4C655B;
  --fill:#1D2A26; --fill2:#2B3D36; --fill3:#0B1311;
  --mark:#FFE12E; --markink:#13302A;
  --power:#FF6F5E; --gnd:#DCEBE2; --i2s:#CA93F2; --spi:#74B4FF; --io:#F4B24F;
  --cutop:#FF7A66; --cubot:#6DB3F2;
  --sbg:#141E1B; --sfr:#FF6F5E; --sfl:#5A3A35; --ssy:#FF6F5E; --swi:#4FD1B0; --stx:#9FB6AB;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{appearance:none;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#app{display:grid;grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1.5px solid var(--ink);background:var(--sheet)}
header b{font-size:16px;letter-spacing:.01em}
.seg{display:inline-flex;border:1.5px solid var(--ink)}
.seg button{padding:6px 12px;font-size:13px;border-left:1.5px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
#cfgSeg{margin-left:auto}

#stage{position:relative;overflow:hidden;min-width:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px}
#view3d{position:absolute;inset:0}
#view3d canvas{display:block;width:100%;height:100%;touch-action:none}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:auto;
  background:var(--sheet);border:1.5px solid var(--ink);font:700 12px/1 var(--mono);display:grid;place-items:center}
.pin.hot{background:var(--mark);color:var(--markink);border-color:var(--markink)}
.pin.off{opacity:.3}
.dimtxt{position:absolute;left:0;top:0;font:400 11px/1 var(--mono);color:var(--ink);background:var(--paper);padding:2px 4px;
  transform:translate(-50%,-50%);white-space:nowrap}
#tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--sheet);font:400 12px/1.2 var(--mono);padding:4px 7px;white-space:nowrap;z-index:5}

.over{position:absolute;z-index:3}
#proj{top:12px;left:max(12px,env(safe-area-inset-left,0px));background:var(--sheet)}
#proj button{padding:5px 10px;font-size:12px}
#expl{top:12px;right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;background:var(--sheet);
  border:1.5px solid var(--ink);padding:5px 10px;font-size:12px}
#expl input{width:120px;accent-color:var(--ink)}
#chips{bottom:12px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - 24px)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);border:1.5px solid var(--ink);padding:4px 8px;font-size:12px}
.chip i{width:10px;height:10px;display:block}
.chip[aria-pressed="true"]{background:var(--mark);color:var(--markink);border-color:var(--markink)}
#block{bottom:12px;left:max(12px,env(safe-area-inset-left,0px));border:1.5px solid var(--ink);background:var(--sheet);
  font:400 11px/1.25 var(--mono);display:grid;grid-template-columns:auto auto}
#block div{padding:3px 8px;border-bottom:1px solid var(--ink)}
#block div:nth-child(odd){border-right:1px solid var(--ink);color:var(--ink2)}
#block div:nth-last-child(-n+2){border-bottom:0}
#block div:first-child,#block div:nth-child(2){font-weight:700;color:var(--ink)}

.pane{position:absolute;inset:0;overflow:auto;padding-block:16px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper)}
#schWrap{overflow-x:auto}
#sch{display:block;width:100%;min-width:680px;max-width:1040px;height:auto;margin:0 auto}
#sch text{fill:var(--ink);font:400 13px var(--mono)}
#sch text.t{font:700 14px var(--sans)}
#sch text.s{fill:var(--ink2);font-size:12px}
.blk{cursor:pointer}
.blk rect{fill:var(--fill);stroke:var(--ink);stroke-width:1.5}
.blk.hot rect{fill:var(--mark)}
.blk.hot text{fill:var(--markink)!important}
.nl{fill:none;stroke-width:2;pointer-events:none}
.nl.hot{stroke-width:3.5}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.off{opacity:.16}
#flow{list-style:none;margin:18px auto 0;padding:0;max-width:1040px;display:flex;flex-wrap:wrap;gap:8px 0;font-size:12.5px}
#flow li{display:flex;align-items:stretch}
#flow li div{border:1.5px solid var(--ink);background:var(--sheet);padding:5px 9px;display:grid;gap:1px}
#flow b{font-weight:700}
#flow span{font:400 11.5px var(--mono);color:var(--ink2)}
#flow li+li::before{content:"→";align-self:center;padding:0 7px;font-family:var(--mono)}

#planWrap{overflow-x:auto}
#plan{display:block;width:100%;min-width:820px;max-width:1180px;height:auto;margin:0 auto;background:var(--sbg)}
#plan text{fill:var(--stx);font:400 13px var(--sans)}
#plan text.p{font:400 13px var(--mono)}
#plan text.n{font:400 10.5px var(--mono)}
#plan text.f{fill:var(--sfr);font-size:15px}
.fr{fill:none;stroke:var(--sfr);stroke-width:1}
.fr.l{stroke:var(--sfl)}
.pn{cursor:pointer}
.pn .ha{fill:none;stroke:var(--mark);stroke-width:9;stroke-linecap:round;opacity:0}
.pn.hot .ha{opacity:1}
.wi{fill:none;stroke:var(--swi);stroke-width:1.6}
.wi.y{stroke:var(--ssy)}
.jn{fill:var(--swi)}
.pn.hot .wi{stroke:var(--markink)}
.pn.hot .jn{fill:var(--markink)}
.sy{cursor:pointer}
.sy .ha{fill:transparent;stroke:none}
.sy.hot .ha{fill:var(--mark)}
.sy path,.sy circle,.sy .bd{fill:none;stroke:var(--ssy);stroke-width:1.5}
.sy.hot path,.sy.hot circle,.sy.hot .bd{stroke:var(--markink)}
.sy.hot text{fill:var(--markink)!important}

#pcbWrap{max-width:800px;margin:0 auto;display:grid;gap:18px}
.pcbneu{display:block;border:1.5px solid var(--ink);background:var(--mark);color:var(--markink);padding:9px 12px;font-weight:700;text-decoration:none}
.pcbneu:hover{text-decoration:underline}
#pcbWrap h3{margin:0 0 6px;font-size:13px;font-weight:700}
#pcbWrap canvas{display:block;width:100%;cursor:pointer;background:var(--fill);border:1.5px solid var(--ink)}

#panel{overflow:auto;min-width:0;border-left:1.5px solid var(--ink);background:var(--sheet);padding-block:4px 24px;
  padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel h2{margin:18px 0 2px;font:700 11.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.09em}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto 12px;gap:8px;align-items:baseline;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.row .no{font:700 12px var(--mono)}
.row .nm{min-width:0}
.row .pr{font:400 12px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .pl{font:400 13px var(--mono)}
.row[aria-expanded="true"]{background:var(--mark);color:var(--markink);box-shadow:-8px 0 0 var(--mark),8px 0 0 var(--mark)}
.row[aria-expanded="true"] .pr{color:var(--markink)}
.row .sq{width:10px;height:10px;display:block;align-self:center;justify-self:center}
.det{padding:8px 0 10px;border-bottom:1px solid var(--line);font-size:13px}
.det dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px}
.det dt{color:var(--ink2);font:400 12px/1.5 var(--mono)}
.det dd{margin:0;min-width:0}
.sum{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-weight:700}
.sum span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
#panel ul,#panel ol{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-size:13px}
#panel ol{counter-reset:s}
#panel ol li{counter-increment:s;display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
#panel ol li::before{content:counter(s);font:700 12px/1.55 var(--mono)}
#panel ul li{padding-left:12px;border-left:3px solid var(--power)}

#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
@media (max-width:880px){
  #app{display:block;height:auto}
  #stage{height:66vh;min-height:420px}
  #panel{border-left:0;border-top:1.5px solid var(--ink);overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (max-width:560px){
  #block{display:none}
  #expl input{width:84px}
  .seg button{padding:6px 9px}
}
</style>

<div id="app">
  <header>
    <b>Take-Marker</b>
    <div class="seg" id="viewSeg" role="group" aria-label="Ansicht">
      <button id="v3d" data-view="3d" aria-pressed="true">3D</button>
      <button id="vsch" data-view="sch" aria-pressed="false">Architektur</button>
      <button id="vplan" data-view="plan" aria-pressed="false">Schaltplan</button>
      <button id="vpcb" data-view="pcb" aria-pressed="false">Platine</button>
    </div>
    <div class="seg" id="cfgSeg" role="group" aria-label="Aufbau">
      <button id="cSteck" data-cfg="steck" aria-pressed="true">Steckbrett</button>
      <button id="cDruck" data-cfg="druck" aria-pressed="false">3D-Druck</button>
      <button id="cFinal" data-cfg="final" aria-pressed="false">Final</button>
    </div>
  </header>

  <main id="stage">
    <div id="view3d">
      <div id="pins"></div>
      <div id="tip" hidden></div>
    </div>
    <div class="pane" id="viewSch" hidden>
      <div id="schWrap"><svg id="sch" viewBox="50 34 840 586" role="img" aria-label="Architektur"></svg></div>
      <ol id="flow"></ol>
    </div>
    <div class="pane" id="viewPlan" hidden>
      <div id="planWrap"><svg id="plan" viewBox="0 0 1120 792" role="img" aria-label="Schaltplan"></svg></div>
    </div>
    <div class="pane" id="viewPcb" hidden>
      <div id="pcbWrap">
        <a class="pcbneu" href="../platine/">Alter Entwurf vom 02.11. Aktueller Stand: Platine v3 aus KiCad →</a>
        <div><h3>Oberseite, Entwurf 02.11.</h3><canvas id="pcbT" aria-label="Platine Oberseite"></canvas></div>
        <div><h3>Unterseite, Entwurf 02.11., von oben durchgesehen</h3><canvas id="pcbB" aria-label="Platine Unterseite"></canvas></div>
      </div>
    </div>
    <div class="over seg" id="proj" role="group" aria-label="Projektion">
      <button id="pIso" data-proj="iso">Iso</button>
      <button id="pTop" data-proj="top">Oben</button>
      <button id="pSide" data-proj="side">Seite</button>
    </div>
    <label class="over" id="expl" hidden>Explosion <input id="explR" type="range" min="0" max="100" value="100"></label>
    <div class="over" id="chips"></div>
    <div class="over" id="block"></div>
  </main>

  <aside id="panel"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={};
function readTheme(){
  const s=getComputedStyle(document.documentElement);
  ['paper','sheet','ink','ink2','line','fill','fill2','fill3','mark','markink','power','gnd','i2s','spi','io','cutop','cubot']
    .forEach(k=>{C[k]=s.getPropertyValue('--'+k).trim()});
}

/* ---------- Inhalt ---------- */
const GROUPS={power:'Strom',gnd:'Masse',i2s:'I2S',spi:'SPI',io:'Knöpfe + LED'};

const NET_COMMON={
  nck:{g:'i2s',a:'D5',b:'SCK Mikrofon',d:'Takt, 1.024 MHz',parts:['xiao','mic']},
  nws:{g:'i2s',a:'D6',b:'WS Mikrofon',d:'Kanaltakt, 16 kHz',parts:['xiao','mic']},

  nmosi:{g:'spi',a:'D10',b:'MOSI',d:'Daten zur Karte',parts:['xiao','sd']},
  nmiso:{g:'spi',a:'MISO',b:'D9',d:'Daten von der Karte',parts:['xiao','sd']},
  nk1:{g:'io',a:'D0',b:'Knopf 1',d:'Marke, gedrückt = LOW',parts:['xiao','k1']},
  nk2:{g:'io',a:'D1',b:'Knopf 2',d:'Notiz, gedrückt = LOW',parts:['xiao','k2']},

};
const NETS={
  steck:Object.assign({
    n5v:{g:'power',a:'5V',b:'VCC SD',d:'5 V aus USB',parts:['xiao','sd','usb']},

  },NET_COMMON),
  final:Object.assign({
    nbat:{g:'power',a:'Akku +',b:'Schalter, BAT',d:'3.0 bis 4.2 V',parts:['akku','sw','xiao']},
    n3v3:{g:'power',a:'3V3',b:'SD, Mikrofon',d:'3.3 V, bis 700 mA',parts:['xiao','mic','sd']},
    ngnd:{g:'gnd',a:'GND',b:'Massefläche',d:'ganze Unterseite',parts:['xiao','mic','sd','k1','k2','led','akku']}

};
NETS.final=Object.assign({},NETS.final,{
  nk1:{g:'io',a:'D0',b:'Knopf ○',d:'Marke, gedrückt = LOW',parts:['xiao','k1']},
  nk2:{g:'io',a:'D1',b:'Knopf △',d:'Notiz, gedrückt = LOW',parts:['xiao','k2']}
});

NETS.druck=Object.assign({},NETS.final,{
  n3v3:{g:'power',a:'3V3',b:'SD, Mikrofon',d:'3.3 V',parts:['xiao','mic','sd']},
  ngnd:{g:'gnd',a:'GND',b:'alle Teile',d:'Draht auf dem Lochraster',parts:['xiao','mic','sd','k1','k2','led','akku']}
});

const PARTS={
  steck:[
    {id:'xiao',no:1,name:'XIAO ESP32-S3',pr:'11.90',facts:[['Aufgabe','nimmt auf, zählt Samples, schreibt auf die Karte'],['Lage','Spalte 2 bis 8, Reihen C und G, USB-C zeigt nach links'],['Prüfen','die kleine runde Antennenbuchse liegt dann unten rechts'],['Stifte','zwei 7er-Leisten lagen bei, heute nur aufgesteckt, nicht gelötet'],['Frei','D2']]},
    {id:'mic',no:2,name:'I2S-Mikrofon',pr:'8.90',facts:[['Typ','DFRobot SEN0327 laut Etikett, rund, ca. 14 mm'],['Stifte','schon angelötet, 2 × 3'],['Pins','GND, VDD, SD und L/R, WS, SCK'],['Lage','über der Mittelrille, Spalte 11 bis 13, Reihen E und F, Schrift nach oben'],['Spannung','3.3 V, nie 5 V']]},
    {id:'sd',no:3,name:'Micro-SD-Modul',pr:'4.90',facts:[['Lage','hochkant in Reihe B, CS in Spalte 16 bis GND in Spalte 21'],['Richtung','Kartenschlitz zeigt zur oberen Schiene. Zeigt er zu euch, ist die Reihenfolge gespiegelt (Fehler in der Zeichnung bis 16.11. abends)'],['Spannung','VCC 5 V. Auf dem Modul sitzen ein 3.3-V-Regler (1117) und ein Pegelwandler (74LVC125A), Foto 16.11.'],['MISO','kommt deshalb mit höchstens 3.3 V zurück'],['Karte','FAT32, höchstens 32 GB']]},
    {id:'k1',no:4,name:'Knopf 1, Marke',pr:'vorhanden',facts:[['Pin','D0 mit internem Pull-up'],['Beine','über der Mittelrille, Spalte 23 und 25'],['Benutzt','F23 zu D0, E25 zu GND (diagonal)'],['Datei','schreibt Sample und M in marks.csv']]},
    {id:'k2',no:5,name:'Knopf 2, Notiz',pr:'vorhanden',facts:[['Pin','D1 mit internem Pull-up'],['Beine','über der Mittelrille, Spalte 26 und 28'],['Benutzt','F26 zu D1, E28 zu GND (diagonal)'],['Bedienung','halten = Notiz läuft'],['Datei','schreibt N+ und N− in marks.csv']]},
    {id:'led',no:6,name:'LED + Widerstand',pr:'vorhanden',facts:[['Widerstand','von I6 nach I10, 220 bis 1 kΩ'],['LED','langes Bein J10, kurzes Bein in die blaue Schiene unten'],['Blitz','alle 2 s = Aufnahme läuft'],['An','während Notiz, kurz nach Marke'],['Schnell','Fehler, Karte oder Mikrofon']]},
    {id:'stift',no:7,name:'Stiftleisten 2 × 7',pr:'dabei',facts:[['Heute','lange Seite ins Steckbrett, XIAO obendrauf'],['Später','anlöten, dann wackelt nichts mehr'],['Reserve','1 × 40 aus der Tüte']]},
    {id:'board',no:8,name:'Steckbrett 830',pr:'vorhanden',facts:[['Gezeichnet','nur linke Hälfte, Spalte 0 bis 30'],['Schiene oben','aussen rot = 3V3, innen blau = GND'],['Schiene unten','aussen blau = GND, innen rot bleibt leer'],['Mitte','Schienen bei 30 unterbrochen, darum alles links davon'],['Zahlen','nur die oben gelten, die unten sind für das umgedrehte Brett']]},
    {id:'usb',no:9,name:'USB-C-Kabel',pr:'vorhanden',facts:[['Strom','Mac oder Powerbank'],['Muss','Datenkabel, sonst geht das Aufspielen nicht'],['Beim Stecken','abziehen']]}
  ],
  druck:[
    {id:'xiao',no:1,name:'XIAO ESP32-S3',pr:'11.90',facts:[['Montage','auf Stiftleiste im Lochraster'],['USB-C','Laden und Aufspielen, zeigt nach hinten'],['BAT','Akku auf die Pads unten löten']]},

const FIT={
  steck:{c:[158,122,-6,9,0]},
  druck:{c:[198,152,42.5,10,-22],o:[176,256,42.5,26,0]},
  final:{c:[165,120,30.5,8,-16],o:[128,178,30.5,21,0]}

function fitVals(){
  const f=FIT[cfg],o=f.o||f.c,u=cfg==='steck'?1:expl,m=i=>f.c[i]+(o[i]-f.c[i])*u;
  return{w:m(0),h:m(1),t:V(m(2),m(3),m(4))};
}
const PROJ={iso:[1,.86,1.05],top:[0,1,.002],side:[0,.02,1]};
function fit(){
  if(!has3d)return;
  const r=$('view3d').getBoundingClientRect(),a=Math.max(r.width,1)/Math.max(r.height,1),f=fitVals();
  const hh=Math.max(f.h/2,f.w/2/a);
  camera.left=-hh*a;camera.right=hh*a;camera.top=hh;camera.bottom=-hh;camera.updateProjectionMatrix();
  camera.position.add(f.t.clone().sub(controls.target));
  controls.target.copy(f.t);
  renderer.setSize(r.width,r.height,false);
  controls.update();invalidate();
}
function setProj(name,instant){
  const d=V(...PROJ[name]).normalize().multiplyScalar(420),to=controls.target.clone().add(d);
  document.querySelectorAll('#proj button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.proj===name)));
  if(instant||reduced){camera.position.copy(to);controls.update();invalidate();return}
  tween={from:camera.position.clone(),to,t0:performance.now(),ms:420};
}
function applyState(){
  if(!has3d)return;
  const w=world[cfg];
  Object.values(w.parts).forEach(p=>{
    const mode=partMode(p.id),ghost=mode==='ghost';
    p.meshes.forEach(m=>{
      const t=m.userData.tone;
      if(t)m.material.color.set(mode==='hot'?C.mark:C[t]);
      const o=ghost?.13:1; m.material.opacity=o; m.material.depthWrite=o>.5;
      const e=m.children[0];
      if(e){e.material.opacity=ghost?.2:1;e.material.color.set(C.ink)}
    });
    if(p.leader){p.leader.material.opacity=ghost?.15:1;p.leader.material.color.set(C.ink2)}
  });
  w.wires.forEach(x=>{
    const on=netOn(x.net); x.mesh.material.opacity=on?1:.1; x.mesh.material.depthWrite=on;
    x.mesh.material.color.set(x.real||C[NETS[cfg][x.net].g]);
  });
  if(world.final&&cfg==='final')paintPcbTex();
  markPins();invalidate();
}

const INNER={final:['xiao','mic','sd','pcb','akku'],druck:['xiao','mic','sd','perf','strip','akku','sw','led']};
function updateHide(){
  Object.values(world[cfg].parts).forEach(p=>{
    if(!p.pin)return;
    const hide=cfg!=='steck'&&expl<.3&&INNER[cfg].includes(p.id)&&partMode(p.id)==='normal';
    p.pin.hidden=hide; if(p.leader)p.leader.visible=!hide;
  });
}
function updatePins(){
  const r=renderer.domElement.getBoundingClientRect(),w=world[cfg],v=new THREE.Vector3();
  const place=(el,x,y)=>{el.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)'};
  Object.values(w.parts).forEach(p=>{
    if(!p.pin)return;
    p.group.updateMatrixWorld();
    v.copy(p.tagAt); p.group.localToWorld(v); v.project(camera);
    place(p.pin,(v.x+1)/2*r.width,(1-v.y)/2*r.height);
  });
  w.dims.forEach(d=>{
    if(d.el.hidden)return;
    v.copy(d.at).project(camera);
    d.el.style.transform='translate(-50%,-50%) translate('+Math.round((v.x+1)/2*r.width)+'px,'+Math.round((1-v.y)/2*r.height)+'px)';
  });
}
function loop(){
  requestAnimationFrame(loop);
  if(tween){
    const u=Math.min(1,(performance.now()-tween.t0)/tween.ms),e=u*u*(3-2*u);
    camera.position.lerpVectors(tween.from,tween.to,e);controls.update();dirty=true;
    if(u>=1)tween=null;
  }
  if(dirty&&view==='3d'){dirty=false;updateHide();renderer.render(scene,camera);updatePins()}
}
function pickAt(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  const n=new THREE.Vector2((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(n,camera);
  const hits=ray.intersectObjects(world[cfg].pick,false);
  for(const h of hits){
    const u=h.object.userData;
    if(!u.proxy&&h.object.material.opacity<.5)continue;
    if(u.pcb){
      const g=world.final.parts.pcb.group.position,net=hitPcb(u.pcb,h.point.x-g.x,h.point.z-g.z);
      if(net)return{type:'net',id:net};
    }
    return u.sel;
  }
  return null;
}
function nameOf(s){
  if(!s)return'';
  if(s.type==='part'){const p=PARTS[cfg].find(x=>x.id===s.id);return p?p.name:''}
  const n=NETS[cfg][s.id];return n?n.a+' → '+n.b:'';
}
function init3d(){
  const box=$('view3d');
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setClearColor(0x000000,0);
  box.prepend(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.OrthographicCamera(-1,1,1,-1,-2000,3000);
  scene.add(new THREE.AmbientLight(0xffffff,.8));
  const d=new THREE.DirectionalLight(0xffffff,.26); d.position.set(-.4,1,.7); scene.add(d);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enablePan=true; controls.minZoom=.6; controls.maxZoom=8; controls.screenSpacePanning=true;
  controls.addEventListener('change',invalidate);
  ray=new THREE.Raycaster();
  buildSteck(); buildDruck(); buildFinal();
  has3d=true;
  controls.target.copy(fitVals().t);
  camera.position.copy(controls.target).add(V(...PROJ.iso).normalize().multiplyScalar(420));
  const cv=renderer.domElement;let down=null,moveQ=null;
  cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];$('tip').hidden=true});
  cv.addEventListener('pointerup',e=>{
    if(!down)return;
    if(Math.hypot(e.clientX-down[0],e.clientY-down[1])<5)setSel(pickAt(e.clientX,e.clientY));
    down=null;
  });
  cv.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch'||e.buttons)return;
    if(moveQ)return;
    moveQ=[e.clientX,e.clientY];
    requestAnimationFrame(()=>{
      const s=pickAt(moveQ[0],moveQ[1]),tip=$('tip');
      if(s){
        const r=cv.getBoundingClientRect();
        tip.textContent=nameOf(s); tip.hidden=false;
        tip.style.transform='translate('+Math.min(moveQ[0]-r.left+14,r.width-200)+'px,'+(moveQ[1]-r.top+14)+'px)';
        cv.style.cursor='pointer';
      }else{tip.hidden=true;cv.style.cursor='grab'}
      moveQ=null;
    });
  });
  cv.addEventListener('pointerleave',()=>{$('tip').hidden=true});
  new ResizeObserver(()=>{fit();if(view==='pcb')drawPcbView()}).observe(box);
  loop();
}

  const T=(x,y,t,c,a)=>'<text x="'+x+'" y="'+y+'"'+(c?' class="'+c+'"':'')+(a?' text-anchor="'+a+'"':'')+'>'+t+'</text>';
  const P=(d,c)=>'<path'+(c?' class="'+c+'"':'')+' d="'+d+'"/>';
  const R=(x,y,w,h,c)=>'<rect class="'+c+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"/>';
  const O=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="2.5"/>';
  const pn=(n,s)=>W.push('<g class="pn" data-net="'+n+'" data-sel="net:'+n+'">'+s+'</g>');
  const wire=(n,d,...j)=>pn(n,P(d,'hit')+P(d,'ha')+P(d,'wi')+j.map(([x,y])=>'<circle class="jn" cx="'+x+'" cy="'+y+'" r="3.5"/>').join(''));
  const gnd=(x,y)=>{const d='M'+(x-11)+' '+y+'h22M'+(x-7)+' '+(y+5)+'h14M'+(x-3)+' '+(y+10)+'h6';pn('ngnd',P(d,'hit')+P(d,'ha')+P(d,'wi y'))};
  const flag=(x,y)=>{const d='M'+x+' '+y+'v-22';pn('n3v3',P(d,'hit')+P(d,'ha')+P(d,'wi')+P('M'+(x-10)+' '+(y-22)+'h20','wi y')+T(x,y-29,'+3V3','','middle'))};
  const sym=(id,x,y,w,h,s)=>Y.push('<g class="sy" data-part="'+id+'" data-sel="part:'+id+'">'+R(x,y,w,h,'ha')+s+'</g>');
  const ic=(id,x,y,w,h,ref,val,L,Q,H)=>{
    let d='',s=R(x,y,w,h,'bd')+T(x,y-8,ref)+T(x+w/2,y+h+20,val,'','middle');
    L.forEach(([t,p,no])=>{d+='M'+x+' '+p+'h-30';s+=T(x+8,p+4.5,t,'p')+(no?T(x-15,p-5,no,'n','middle'):'')});
    Q.forEach(([t,p,no])=>{d+='M'+(x+w)+' '+p+'h30';s+=T(x+w-8,p+4.5,t,'p','end')+(no?T(x+w+15,p-5,no,'n','middle'):'')});
    (H||[]).forEach(([t,p])=>{d+='M'+p+' '+y+'v-30';s+=T(p,y+17,t,'p','middle')});
    sym(id,x-30,y-(H?30:0),w+60,h+(H?30:0),s+P(d));
  };
  const nc=(x,y,a)=>sym('xiao',x-6,y-6,12,12,P('M'+(x-5)+' '+(y-5)+'l10 10m0-10l-10 10')+T(a==='end'?x-11:x+11,y+4.5,'frei','',a));
  const knopf=(id,x,y,ref,val)=>sym(id,x-30,y-26,60,50,P('M'+(x-26)+' '+y+'h9.5M'+(x+26)+' '+y+'h-9.5M'+(x-17)+' '+(y-9)+'h34M'+x+' '+(y-9)+'v-11m-7 0h14')+O(x-14,y)+O(x+14,y)+T(x+12,y-13,ref)+T(x,y+19,val,'','middle'));
  const res=(id,x,y,ref,val)=>sym(id,x-28,y-24,56,50,P('M'+(x-26)+' '+y+'h8M'+(x+26)+' '+y+'h-8')+R(x-18,y-6,36,12,'bd')+T(x,y-11,ref,'','middle')+T(x,y+21,val,'','middle'));
  const resV=(id,x,y,ref,val)=>sym(id,x-8,y-28,50,56,P('M'+x+' '+(y-26)+'v8M'+x+' '+(y+26)+'v-8')+R(x-6,y-18,12,36,'bd')+T(x+12,y-3,ref)+T(x+12,y+13,val));
  const led=(id,x,y,ref,val)=>sym(id,x-24,y-22,48,62,P('M'+(x+8)+' '+(y-8)+'L'+(x-8)+' '+y+'L'+(x+8)+' '+(y+8)+'ZM'+(x-8)+' '+(y-8)+'v16M'+(x+8)+' '+y+'h14M'+(x-8)+' '+y+'h-14M'+(x+3)+' '+(y-11)+'l-6-7l.5 4.5m-.5-4.5l4.2 1.7M'+(x+9)+' '+(y-11)+'l-6-7l.5 4.5m-.5-4.5l4.2 1.7')+T(x,y+23,ref,'','middle')+T(x,y+38,val,'','middle'));
  const L=i=>240+50*i;

  // links vom XIAO: Knöpfe, LED, Mikrofon
  wire('nk1','M420 '+L(0)+'H326'); wire('nk2','M420 '+L(1)+'H326');
  wire('ngnd','M274 '+L(0)+'H220V312'); wire('ngnd','M274 '+L(1)+'H220',[220,L(1)]); gnd(220,312);
  knopf('k1',300,L(0),'SW1',bat?'Knopf ○':'Knopf 1'); knopf('k2',300,L(1),'SW2',bat?'Knopf △':'Knopf 2');
  nc(420,L(2),'end');
  wire('nda','M420 '+L(3)+'H230');
  wire('nled','M420 '+L(4)+'H386'); wire('nled','M334 '+L(4)+'H316');
  res('led',360,L(4),'R1','330'); led('led',294,L(4),'D1','LED');
  wire('ngnd','M272 '+L(4)+'H250V462'); gnd(250,462);
  wire('nck','M420 '+L(5)+'H230'); wire('nws','M420 '+L(6)+'H230');
  ic('mic',100,360,100,212,'U2','I2S-Mikrofon',[['VDD',L(3)],['GND',L(5)],['L/R',L(6)]],[['SD',L(3)],['SCK',L(5)],['WS',L(6)]]);
  flag(70,L(3));
  wire('ngnd','M70 '+L(5)+'H50V562'); wire('nlr','M70 '+L(6)+'H50',[50,L(6)]); gnd(50,562);

  // rechts vom XIAO: 3V3, SD
  wire('n3v3','M640 '+L(2)+'H680'); flag(680,L(2));
  wire('ngnd','M640 '+L(1)+'H800',[730,L(1)]); wire('ngnd','M730 '+L(1)+'V312'); gnd(730,312);
  wire('nmosi','M640 '+L(3)+'H800'); wire('nmiso','M640 '+L(4)+'H800'); wire('nsck','M640 '+L(5)+'H800'); wire('ncs','M640 '+L(6)+'H800');
  const sdL=f?[['VDD',L(0),'4'],['VSS',L(1),'6'],['MOSI',L(3),'3'],['MISO',L(4),'7'],['SCK',L(5),'5'],['CS',L(6),'2']]
    :[['VCC',L(0)],['GND',L(1)],['MOSI',L(3)],['MISO',L(4)],['SCK',L(5)],['CS',L(6)]];
  ic('sd',830,200,120,372,f?'J1':'U3',f?'microSD-Sockel':'Micro-SD-Modul',sdL,f?[['DAT1',L(4),'8'],['DAT2',L(5),'1']]:[]);

  const top=[];
  if(bat){
    top.push(['BAT+',500],['BAT−',560]);
    nc(640,L(0));
    wire('n3v3','M800 '+L(0)+'H700',...(f?[[770,L(0)]]:[])); flag(700,L(0));
    wire('nbat','M500 170V90H564'); wire('nbat','M616 90H680V116');
    sym('sw',560,64,60,56,P('M564 90h9.5M616 90h-9.5M576 90L602 77')+O(576,90)+O(604,90)+T(590,64,'SW3','','middle')+T(590,113,'Schalter','','middle'));
    wire('ngnd','M680 134V172'); wire('ngnd','M560 170V150H680',[680,150]); gnd(680,172);
    sym('akku',648,102,132,38,P('M666 116h28M673 122h14M666 128h28M673 134h14')+T(655,112,'+','','middle')+T(704,117,'BT1')+T(704,133,'LiPo 3.7 V'));
  }else{
    top.push(['USB',530]);
    wire('n5v','M640 '+L(0)+'H800'); wire('n5v','M530 130V170');
    sym('usb',490,74,240,56,R(490,90,80,40,'bd')+T(530,115,'USB-C','p','middle')+T(490,82,'J2')+T(582,115,'Mac oder Powerbank'));
    W.push(T(720,L(0)-8,'+5V','','middle'));
  }
  ic('xiao',450,200,160,372,'U1','XIAO ESP32-S3',
    ['D0','D1','D2','D3','D4','D5','D6'].map((t,i)=>[t,L(i),String(i+1)]),
    ['5V','GND','3V3','D10','D9','D8','D7'].map((t,i)=>[t,L(i),String(14-i)]),top);

  if(f){
    wire('n3v3','M770 '+L(0)+'V261'); wire('ngnd','M770 269V'+L(1),[770,L(1)]);
    sym('pcb',708,250,76,32,P('M759 261h22M759 269h22')+T(753,262,'C1','','end')+T(753,278,'100 µF','','end'));
    wire('ncs','M725 '+L(6)+'V600H734',[725,L(6)]); wire('n3v3','M786 600H796'); flag(796,600);
    res('sd',760,600,'R2','10k');
    wire('n3v3','M980 '+L(4)+'V421'); wire('n3v3','M980 369V345'); flag(980,345);
    wire('n3v3','M980 '+L(5)+'H1035V421'); wire('n3v3','M1035 369V345'); flag(1035,345);
    resV('sd',980,395,'R3','10k'); resV('sd',1035,395,'R4','10k');
  }

  let fr=R(10,10,1100,772,'fr')+R(30,30,1060,732,'fr l'),d='';
  for(let i=0;i<6;i++){
    const x=30+i*1060/6;
    if(i)d+='M'+x+' 10V30M'+x+' 762V782';
    fr+=T(x+1060/12,25,i+1,'f','middle')+T(x+1060/12,777,i+1,'f','middle');
  }
  'ABCDE'.split('').forEach((a,i)=>{
    const y=30+i*146.4;
    if(i)d+='M10 '+y+'H30M1090 '+y+'H1110';
    fr+=T(20,y+78,a,'f','middle')+T(1100,y+78,a,'f','middle');
  });
  fr+=P(d+'M680 702H1090M680 732H1090','fr l');
  fr+=T(692,723,'Titel:','f')+T(748,723,'Take-Marker '+BLOCK[cfg][1],'f');
  fr+=T(692,753,'Datum:','f')+T(748,753,cfg==='steck'?'16.11.2026':'02.11.2026','f')+T(870,753,cfg==='steck'?'echte Teile':'Entwurf','f')+T(990,753,'Blatt:','f')+T(1044,753,(['steck','druck','final'].indexOf(cfg)+1)+'/3','f');
  $('plan').innerHTML=fr+W.join('')+Y.join('');
  markSchema();
}

/* ---------- Platine 2D ---------- */
function drawPcbView(){
  const dpr=Math.min(devicePixelRatio||1,2);
  [['pcbT','t'],['pcbB','b']].forEach(([id,l])=>{
    const cv=$(id),W=cv.clientWidth||600,m=Math.max(22,W*.04),s=(W-m*2)/61,Hh=22*s+m*2;
    cv.width=W*dpr; cv.height=Hh*dpr; cv.style.height=Hh+'px';
    const c=cv.getContext('2d'); c.scale(dpr,dpr);
    c.fillStyle=C.fill; c.fillRect(0,0,W,Hh);
    paintPcb(c,l,s,m,m,{bg:C.sheet,cuT:C.cutop,cuB:C.cubot,silk:C.ink,ink:C.ink,flip:false});
    c.strokeStyle=C.ink; c.lineWidth=1.5; c.strokeRect(m,m,61*s,22*s);
    c.fillStyle=C.ink; c.font='400 12px "B612 Mono",monospace'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('61 mm',W/2,m/2);
    c.save(); c.translate(m/2,Hh/2); c.rotate(-Math.PI/2); c.fillText('22 mm',0,0); c.restore();
    cv._map={m,s};
  });
}

/* ---------- Panel ---------- */
function renderPanel(){
  const p=[];
  if(view==='pcb')p.push('<h2>So bauen wir sie</h2><ol>'+STEPS.map(s=>'<li><span>'+s+'</span></li>').join('')+'</ol>');
  if(cfg==='steck'){
    p.push('<h2>Steckliste</h2>');
    STECK.forEach(([sl,t,f],i)=>p.push('<button class="row" data-sel="'+sl+'" aria-expanded="false"><span class="no">'+(i+1)+'</span><span class="nm">'+t+'</span><span class="pr">'+(f||'')+'</span><span class="pl"></span></button>'));
    p.push('<h2>Achtung</h2><ul>'+WARN.steck.map(w=>'<li>'+w+'</li>').join('')+'</ul>');
  }
  p.push('<h2>Stückliste</h2>');
  PARTS[cfg].forEach(x=>{
    p.push('<button class="row" data-sel="part:'+x.id+'" aria-expanded="false"><span class="no">'+x.no+'</span><span class="nm">'+x.name+'</span><span class="pr">'+x.pr+'</span><span class="pl">+</span></button>');
    p.push('<div class="det" data-det="part:'+x.id+'" hidden><dl>'+x.facts.map(f=>'<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>').join('')+'</dl></div>');
  });
  p.push('<div class="sum"><span>'+SUM[cfg][0]+'</span><span>'+SUM[cfg][1]+'</span></div>');
  p.push('<h2>Leitungen</h2>');
  Object.entries(NETS[cfg]).forEach(([id,n])=>{
    p.push('<button class="row" data-sel="net:'+id+'" aria-expanded="false"><i class="sq" style="background:var(--'+n.g+')"></i><span class="nm">'+n.a+' → '+n.b+'</span><span class="pr">'+GROUPS[n.g]+'</span><span class="pl">+</span></button>');
    p.push('<div class="det" data-det="net:'+id+'" hidden><dl><dt>Signal</dt><dd>'+n.d+'</dd><dt>Teile</dt><dd>'+n.parts.map(q=>{const r=PARTS[cfg].find(v=>v.id===q);return r?r.name:q}).join(', ')+'</dd></dl></div>');
  });
  if(cfg!=='steck')p.push('<h2>Offen</h2><ul>'+WARN[cfg].map(w=>'<li>'+w+'</li>').join('')+'</ul>');
  $('panel').innerHTML=p.join('');
  markPanel();
}
function markPanel(){
  const k=key(sel);
  document.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-expanded',String(r.dataset.sel===k)));
  document.querySelectorAll('.det').forEach(d=>{d.hidden=d.dataset.det!==k});
}
function renderChips(){
  const used=new Set(Object.values(NETS[cfg]).map(n=>n.g));
  $('chips').innerHTML=Object.keys(GROUPS).filter(g=>used.has(g)).map(g=>'<button class="chip" id="chip-'+g+'" data-group="'+g+'" aria-pressed="'+(group===g)+'"><i style="background:var(--'+g+')"></i>'+GROUPS[g]+'</button>').join('');
}
function renderBlock(){$('block').innerHTML=BLOCK[cfg].map(t=>'<div>'+t+'</div>').join('')}

/* ---------- Ablauf ---------- */
function sync(){
  applyState(); markPanel(); markSchema();
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.group===group)));
  if(view==='pcb')drawPcbView();
}
function applyView(){
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
  document.querySelectorAll('#cfgSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cfg===cfg)));
  $('view3d').hidden=view!=='3d'; $('viewSch').hidden=view!=='sch'; $('viewPlan').hidden=view!=='plan'; $('viewPcb').hidden=view!=='pcb';
  $('proj').hidden=view!=='3d'||!has3d; $('expl').hidden=view!=='3d'||cfg==='steck'||!has3d;
  $('chips').hidden=view==='pcb'; $('block').hidden=view!=='3d';
  renderPanel();
  if(view==='sch')renderSchema();
  if(view==='plan')renderPlan();
  if(view==='pcb')drawPcbView();
  if(view==='3d'&&has3d){fit();invalidate()}
}
function setCfg(c){
  if(c===cfg)return;
  cfg=c; sel=null; group=null;
  if(c!=='final'&&view==='pcb')view='3d';
  if(has3d){
    Object.keys(world).forEach(k=>{
      world[k].root.visible=k===c;
      world[k].dims.forEach(d=>{d.el.hidden=true});
      Object.values(world[k].parts).forEach(p=>{p.pin=null});
    });
    if(c==='steck')world.steck.dims.forEach(d=>{d.el.hidden=false});
    buildPins();
    controls.target.copy(fitVals().t);
    setProj('iso',true);
    if(c==='steck')fit();else setExplode(expl);
  }
  renderChips(); renderBlock(); applyView(); applyState();
  $('panel').scrollTop=0;
}
function setView(v){
  if(v==='pcb'&&cfg!=='final'){view=v;setCfg('final');return}
  view=v; applyView(); if(has3d)applyState();
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-sel]');
  if(s){const[type,id]=s.dataset.sel.split(':');setSel({type,id});return}
  const g=e.target.closest('[data-group]');
  if(g){group=group===g.dataset.group?null:g.dataset.group;sel=null;sync();return}
  const v=e.target.closest('[data-view]');if(v){setView(v.dataset.view);return}
  const c=e.target.closest('[data-cfg]');if(c){setCfg(c.dataset.cfg);return}
  const p=e.target.closest('[data-proj]');if(p){setProj(p.dataset.proj);return}
  const k=e.target.closest('#pcbT,#pcbB');
  if(k&&k._map){
    const r=k.getBoundingClientRect(),{m,s}=k._map,x=(e.clientX-r.left-m)/s,z=(e.clientY-r.top-m)/s-11,l=k.id==='pcbT'?'t':'b';
    const n=hitPcb(l,x,z);
    if(n){setSel({type:'net',id:n});return}
    const q=COMPS.find(q=>q.l===l&&x>=q.x&&x<=q.x+q.w&&z>=q.z&&z<=q.z+q.d);
    setSel(q?{type:'part',id:q.id}:(x>=0&&x<=61&&z>=-11&&z<=11?{type:'part',id:'pcb'}:null));
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(sel||group)){sel=null;group=null;sync()}});
$('explR').addEventListener('input',e=>{setExplode(+e.target.value/100);invalidate()});

function retheme(){
  readTheme();
  if(has3d){
    paintBoard(); paintPerf();
    Object.values(world).forEach(w=>w.dims.forEach(d=>{
      if(d.line.material)d.line.material.color.set(d.isRef?C.ink2:C.ink);
      (d.line.userData.t||[]).forEach(t=>t.material.color.set(C.ink));
    }));
    applyState();
  }
  if(view==='pcb')drawPcbView();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

readTheme();
try{
  if(!window.THREE||!THREE.OrbitControls)throw new Error('three');
  init3d();
  document.querySelectorAll('#proj button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.proj==='iso')));
  poseWorld(world.druck,1); poseWorld(world.final,1);
  buildPins();
}catch(err){
  has3d=false;
  if(renderer&&renderer.domElement)renderer.domElement.remove();
  view='sch';
  const v=$('v3d'); v.disabled=true; v.title='3D braucht WebGL';
}
renderChips(); renderBlock(); applyView(); renderSchema();
if(has3d)applyState();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(has3d){paintBoard();paintPcbTex();invalidate()}if(view==='pcb')drawPcbView()});
})();
</script>
